# HMS - Hypervisor Management System configuration
# Deploy to /etc/hms.conf on the QNX host.

# Root directory where guest directories live.
# NOT HONOURED: /guests is compiled in throughout (discovery, lifecycle, OTA).
# The key is still parsed so an existing file does not error, but changing it
# has no effect -- it is listed here only so that is not a surprise.
#guests_path=/guests

# Default SSH credentials (guests can override in their guest.conf)
ssh_user=root
ssh_password=
ssh_port=22

# SSH key path (deployed by host build)
ssh_key=/root/.ssh/id_ed25519

# How often HMS rescans /guests for state changes, in seconds.
refresh_interval=5

# OTA / server SCP settings
# Server that holds uploaded OTA packages (user@host)
ota_server=maxmaster@139.185.38.211
# SSH private key ON THE QNX HOST used for SCP to/from the server
ota_server_key=/.ssh/id_ed25519

# Where OTA packages are downloaded and unpacked before being installed.
#
# Must be on a disk-backed filesystem. This used to be /tmp/ota, and /tmp on
# the host image is a symlink to /dev/shmem -- RAM. Pulling a 256 MB rootfs.img
# there and unpacking it there too spends half a gigabyte of memory the
# hypervisor has not already given to the guests.
#
# The default sits on the same filesystem as /guests (the QNX6 data partition),
# so the install copy does not cross a filesystem either. The leading dot keeps
# it out of guest discovery.
ota_stage_dir=/guests/.ota-stage
